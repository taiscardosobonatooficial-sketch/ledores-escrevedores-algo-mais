<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledores e Escrevedores — Outubro Rosa</title>
  <style>
    :root {
      --principal: #c2185b;
      --principal-claro: #f8bbd0;
      --fundo: #fff0f5;
      --texto: #333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--fundo);
      color: var(--texto);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--principal);
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #880e4f;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .banner-rosa {
      background-color: var(--principal-claro);
      border: 2px dashed var(--principal);
      padding: 20px;
      text-align: center;
      margin: 20px auto;
      width: 80%;
      border-radius: 8px;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    .grid-obras {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .obra-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fafafa;
    }
    .obra-item img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 4px;
    }
    .tag {
      font-size: 11px;
      background: var(--principal-claro);
      color: var(--principal);
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 6px;
    }
    .btn-acao {
      background-color: var(--principal);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-conteudo {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 600px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 Ledores e Escrevedores</h1>
    <p>Algo Mais — Histórias que aproximam pessoas</p>
  </header>

  <nav>
    <a href="#acervo">Acervo & Estantes</a>
    <a href="#publicar">Escrever & Publicar</a>
  </nav>

  <div class="banner-rosa">
    <h2>🎀 Outubro Rosa</h2>
    <p>Histórias de coragem, superação, força e esperança.</p>
  </div>

  <div class="container" id="acervo">
    <h2>📖 Estantes de Obras</h2>
    <div class="grid-obras" id="lista-obras">
      <p style="grid-column: 1/-1; text-align: center;">A carregar acervo do Firebase...</p>
    </div>
  </div>

  <div class="container" id="publicar">
    <h2>✍️ Publicar Nova Obra</h2>
    <form id="form-publicar" style="display: flex; flex-direction: column; gap: 10px; max-width: 600px;">
      <input type="text" id="pub-titulo" placeholder="Título da Obra" required style="padding: 10px;">
      <input type="text" id="pub-autor" placeholder="Nome do Autor / Escritor" required style="padding: 10px;">
      
      <select id="pub-categoria" style="padding: 10px;">
        <option value="Livro">Livro</option>
        <option value="Diario">Diário</option>
        <option value="Jornal">Jornal / Revista</option>
        <option value="Redacao">Redação / Documento</option>
      </select>

      <input type="text" id="pub-genero" placeholder="Gênero (ex: Romance, Poesia, Superação)" required style="padding: 10px;">
      <input type="text" id="pub-capa-url" placeholder="Link da Imagem da Capa (URL ex: https://...)" style="padding: 10px;">
      <textarea id="pub-conteudo" placeholder="Conteúdo completo da obra..." rows="6" required style="padding: 10px;"></textarea>
      
      <button type="submit" class="btn-acao">Publicar na Estante</button>
      <p id="msg-pub" style="font-weight: bold; text-align: center;"></p>
    </form>
  </div>

  <!-- MODAL DE LEITURA -->
  <div id="modal-leitura" class="modal">
    <div class="modal-conteudo">
      <span id="read-tag" class="tag">Categoria</span>
      <h2 id="read-titulo" style="color: var(--principal); margin: 10px 0;">Título</h2>
      <p id="read-autor" style="font-style: italic; color: #555; margin-bottom: 15px;"></p>
      <hr style="border: 0; border-top: 1px solid #ddd; margin-bottom: 15px;">
      <div id="read-conteudo" style="white-space: pre-wrap; line-height: 1.6; max-height: 50vh; overflow-y: auto;"></div>
      <button onclick="document.getElementById('modal-leitura').style.display='none'" class="btn-acao" style="margin-top: 20px;">Fechar Leitura</button>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDuJpZ09ofLYD7NjCNkJiC-WoB66qKAvMU",
      authDomain: "ledores-escrevedores-algo-mais.firebaseapp.com",
      projectId: "ledores-escrevedores-algo-mais",
      storageBucket: "ledores-escrevedores-algo-mais.appspot.com",
      messagingSenderId: "175218660400",
      appId: "1:175218660400:web:53d5029c1cecf8eee649f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let obrasCache = [];

    async function carregarObras() {
      const container = document.getElementById('lista-obras');
      try {
        const q = query(collection(db, "livros"));
        const querySnapshot = await getDocs(q);
        
        obrasCache = [];
        querySnapshot.forEach((doc) => {
          obrasCache.push({ id: doc.id, ...doc.data() });
        });

        if (obrasCache.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">Nenhuma obra cadastrada ainda. Seja o primeiro a publicar abaixo!</p>';
          return;
        }

        container.innerHTML = '';
        obrasCache.forEach(obra => {
          const item = document.createElement('div');
          item.className = 'obra-item';
          item.innerHTML = `
            <div>
              <img src="${obra.capa_url || 'https://via.placeholder.com/200x280?text=Sem+Capa'}" alt="Capa">
              <span class="tag">${obra.categoria || 'Livro'} • ${obra.genero || 'Geral'}</span>
              <h3 style="margin: 6px 0; color: var(--principal); font-size: 16px;">${obra.titulo}</h3>
              <p style="font-size: 12px; color: #666; font-style: italic;">Por ${obra.autor}</p>
            </div>
            <button class="btn-acao" onclick="abrirLeitor('${obra.id}')">📖 Ler Obra</button>
          `;
          container.appendChild(item);
        });
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Erro ao carregar acervo do Firebase: ${e.message}</p>`;
      }
    }

    window.abrirLeitor = function(id) {
      const obra = obrasCache.find(o => o.id === id);
      if (!obra) return;
      document.getElementById('read-tag').textContent = `${obra.categoria} • ${obra.genero}`;
      document.getElementById('read-titulo').textContent = obra.titulo;
      document.getElementById('read-autor').textContent = `Autor(a): ${obra.autor}`;
      document.getElementById('read-conteudo').textContent = obra.conteudo;
      document.getElementById('modal-leitura').style.display = 'flex';
    };

    const formPub = document.getElementById('form-publicar');
    formPub.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg-pub');
      msg.textContent = "A publicar no Firebase..."; 

      try {
        const novaObra = {
          titulo: document.getElementById('pub-titulo').value.trim(),
          autor: document.getElementById('pub-autor').value.trim(),
          categoria: document.getElementById('pub-categoria').value,
          genero: document.getElementById('pub-genero').value,
          conteudo: document.getElementById('pub-conteudo').value.trim(),
          capa_url: document.getElementById('pub-capa-url').value.trim() || 'https://via.placeholder.com/200x280?text=Sem+Capa',
          criado_em: new Date()
        };

        await addDoc(collection(db, "livros"), novaObra);

        msg.textContent = "🎉 Publicado com sucesso!"; 
        msg.style.color = "green";
        formPub.reset();
        carregarObras();
      } catch (e) {
        msg.textContent = "Erro ao publicar: " + e.message;
        msg.style.color = "red";
      }
    });

    carregarObras();
  </script>
</body>
</html>
