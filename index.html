<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledores e Escrevedores — Algo Mais</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --fundo: #fff4f9; --texto: #30233b; --principal: #b83f79;
      --navegacao: #73224a; --botao: #d64d90; --borda: #f5cae0;
      --cartao: #ffffff; --whatsapp: #25d366;
    }
    body { margin: 0; font-family: Georgia, serif; background: var(--fundo); color: var(--texto); transition: background 0.4s; }
    
    /* Cabeçalho e Autenticação */
    header { background: var(--principal); color: white; padding: 20px 18px; text-align: center; position: relative; }
    header h1 { margin: 0 0 5px; font-size: clamp(24px, 5vw, 34px); }
    header p { margin: 0; opacity: 0.9; font-size: 14px; }
    
    .auth-bar { background: rgba(0,0,0,0.15); padding: 8px 15px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .auth-btns button { background: white; color: var(--navegacao); border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    
    nav { background: var(--navegacao); padding: 12px; text-align: center; position: sticky; top: 0; z-index: 100; }
    nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; display: inline-block; padding: 4px; font-size: 15px; }
    nav a:hover { text-decoration: underline; }
    
    main { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
    .card { background: var(--cartao); border-radius: 16px; padding: 22px; margin-bottom: 25px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
    
    /* Temas Comemorativos Sazonais */
    body[data-theme="normal"] { --fundo: #fbf7ff; --principal: #593778; --navegacao: #43265c; --botao: #70479a; --borda: #eadff4; }
    body[data-theme="rosa"] { --fundo: #fff4f9; --principal: #b83f79; --navegacao: #73224a; --botao: #d64d90; --borda: #f5cae0; }
    body[data-theme="novembro-azul"] { --fundo: #f0f7ff; --principal: #1b65a8; --navegacao: #0e3f6c; --botao: #2b82d4; --borda: #c3deeb; }
    body[data-theme="natal"] { --fundo: #fcf6f6; --principal: #a81c1c; --navegacao: #1e522d; --botao: #b82323; --borda: #e8c5c5; }

    /* Estantes / Filtros */
    .estantes-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .btn-estante { background: #f0e6f2; border: 1px solid var(--borda); padding: 8px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: bold; color: var(--texto); }
    .btn-estante.ativo { background: var(--botao); color: white; border-color: var(--botao); }

    /* Grid de Obras */
    .grid-obras { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; margin-top: 15px; }
    .obra-item { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .obra-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
